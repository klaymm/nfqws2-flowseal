# Веб-интерфейс nfqws2-flowseal на порту 90. Ставит и обновляет nfqws2-flowseal.
server.port := 8088
# PHP запускает утилиту и скрипт службы nfqws2, им нужны права root
server.username := ""
server.groupname := ""

$SERVER["socket"] == ":90" {
    cgi.assign += ( ".php" => "/opt/bin/php-cgi" )
    static-file.exclude-extensions += (".php")
    setenv.set-environment = ( "PATH" => "/opt/sbin:/opt/bin:/opt/usr/sbin:/opt/usr/bin:/usr/sbin:/usr/bin:/sbin:/bin" )
    index-file.names = ( "index.html" )
    server.error-handler-404 = "/nfqws2-flowseal/index.html"
    url.rewrite-once = ( "^/(.*)" => "/nfqws2-flowseal/$1" )
}
