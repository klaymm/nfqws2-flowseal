# Managed by nfqws2-flowseal: https://github.com/klaymm/nfqws2-flowseal
# Strategy and lists from Flowseal zapret-discord-youtube. Change the strategy in the web interface
# or with "nfqws2-flowseal strategy <id>". The file is overwritten on update and strategy change;
# put your own domains into lists/user.list.

# Provider network interface, e.g. eth3
# You can specify multiple interfaces separated by space, e.g. ISP_INTERFACE="eth3 nwg1"
ISP_INTERFACE=""

# All arguments here: https://github.com/bol-van/zapret2/blob/master/docs/manual.md

# Every Flowseal fake is loaded, so any strategy can be switched on without changing this list
NFQWS_BASE_ARGS="--fastpath-workaround=auto
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua
                 --blob=quic_google:@/opt/etc/nfqws2/blobs/quic_initial_www_google_com.bin
                 --blob=tls_google:@/opt/etc/nfqws2/blobs/tls_clienthello_www_google_com.bin
                 --blob=tls_max_ru:@/opt/etc/nfqws2/blobs/tls_clienthello_max_ru.bin
                 --blob=tls_4pda:@/opt/etc/nfqws2/blobs/tls_clienthello_4pda_to.bin
                 --blob=tls_sochi_park:@/opt/etc/nfqws2/blobs/tls_clienthello_sochi_park.bin
                 --blob=stun:@/opt/etc/nfqws2/blobs/stun.bin
                 --blob=stun2:@/opt/etc/nfqws2/blobs/stun2.bin
                 --blob=discord_fake:@/opt/etc/nfqws2/blobs/quic_initial_steamcommunity_com.bin"

# Strategy profiles in Flowseal order. Fakes that rely on ts fooling need TCP timestamps:
# without them (Windows default) the fake reaches the server as real data, so such clients skip it.
@STRATEGY@

# The package start script appends one more profile from these two; it is switched off
NFQWS_ARGS="--skip"
NFQWS_EXTRA_ARGS=""

# IPv6 support
IPV6_ENABLED=0

# TCP ports for iptables rules
TCP_PORTS=80,443,2053,2083,2087,2096,8443

# UDP ports for iptables rules
UDP_PORTS=443,19294:19344,50000:50100

# Keenetic access policy, set by nfqws2-flowseal: in the web interface or with "nfqws2-flowseal policy".
# Empty or not found on the router - all devices are processed
POLICY_NAME=""
# Policy mode (0 - only devices in the policy, 1 - all devices except them)
POLICY_EXCLUDE=0

# Syslog logging level (0 - silent, 1 - debug)
LOG_LEVEL=0
LOG_DEBUG_PATH="@/opt/var/log/nfqws2-debug.log"

NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1
